{% extends "layouts/agent.html" %}
{% set pageName="Home" %}

{% block beforeContent %}
{% include "includes/back.njk" %}
{% endblock %}

{% block content %}
<form method="post" action="/v2/agent/registration/check-your-answers">
<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <div class="govuk-form-group">
      <h1 class="govuk-label-wrapper">
        <label class="govuk-label govuk-label--l" for="event-name">
          What is {{ data['orgname'] }}'s phone number?
        </label>
      </h1>
      <input class="govuk-input" id="orgphone" name="orgphone" type="text" aria-describedby="organisation-email">
    </div>
    <button type="submit" class="govuk-button" data-module="govuk-button">
      Continue
    </button>
  </div>
</div>
</form>
<!--
{{ data | dump }}
-->
{% endblock %}
